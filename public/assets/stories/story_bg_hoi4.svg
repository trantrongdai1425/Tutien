<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="75%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="herbGlow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
    <filter id="alchemyGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#skyGrad4)"/>
  <rect width="1280" height="720" fill="url(#herbGlow)"/>

  <!-- Đồi chè, bậc thang dược điền ngút ngàn -->
  <path d="M-100,520 Q280,440 640,490 T1380,460 L1380,720 L-100,720 Z" fill="#047857"/>
  <path d="M-100,580 Q320,530 680,560 T1380,540 L1380,720 L-100,720 Z" fill="#065f46"/>
  <path d="M-100,640 Q380,600 740,620 T1380,610 L1380,720 L-100,720 Z" fill="#022c22"/>

  <!-- Lò Thần Nông Dược Đỉnh ngút trời trung tâm -->
  <g fill="#d97706" stroke="#fef3c7" stroke-width="1.5" filter="url(#alchemyGlow)">
    <ellipse cx="640" cy="380" rx="90" ry="25" fill="#b45309"/>
    <path d="M550,380 C540,480 740,480 730,380 Z" fill="#f59e0b"/>
    <rect x="560" y="470" width="18" height="50" rx="4" fill="#92400e"/>
    <rect x="662" y="470" width="18" height="50" rx="4" fill="#92400e"/>
    <polygon points="600,360 680,360 640,310" fill="#fde68a"/>
    <circle cx="640" cy="305" r="12" fill="#ef4444"/>
  </g>

  <!-- Khói đan dược bảy màu lượn lờ -->
  <path d="M640,300 Q600,200 660,140 T630,60" fill="none" stroke="#a7f3d0" stroke-width="6" opacity="0.75" filter="url(#alchemyGlow)"/>

  <!-- Tiêu đề chương hồi Thư Pháp -->
  <g font-family="'Times New Roman', serif">
    <rect x="40" y="40" width="460" height="72" rx="6" fill="#022c22" opacity="0.75" stroke="#34d399" stroke-width="1.5"/>
    <text x="60" y="72" fill="#a7f3d0" font-size="14" font-weight="bold" letter-spacing="3">HỒI 4: HÓA PHÀM CẦU ĐẠO</text>
    <text x="60" y="98" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="1">ĐAN HÀ BÁCH THẢO TIÊN CỐC</text>
  </g>
</svg>