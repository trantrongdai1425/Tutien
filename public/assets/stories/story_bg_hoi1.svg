<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="skyGrad1" cx="50%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="35%" stop-color="#450a0a"/>
      <stop offset="70%" stop-color="#180505"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#ff7800" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bầu trời đêm rực lửa -->
  <rect width="1280" height="720" fill="url(#skyGrad1)"/>

  <!-- Trăng máu mờ ảo bị mây che -->
  <circle cx="1020" cy="180" r="70" fill="#f87171" opacity="0.6" filter="url(#glow)"/>
  <ellipse cx="980" cy="190" rx="120" ry="30" fill="#180505" opacity="0.75"/>

  <!-- Dãy núi xa sừng sững -->
  <path d="M-50,520 Q180,320 380,440 T850,360 Q1050,420 1330,480 L1330,720 L-50,720 Z" fill="#1c0505" opacity="0.85"/>
  <path d="M-50,580 Q120,420 320,500 T760,450 Q960,480 1330,550 L1330,720 L-50,720 Z" fill="#0f0303"/>

  <!-- Mái đình, mái chùa cổ phong bốc cháy -->
  <g fill="#0a0202">
    <!-- Tháp cổ 5 tầng bên vách núi -->
    <rect x="180" y="380" width="36" height="180"/>
    <polygon points="170,380 226,380 198,340"/>
    <polygon points="160,420 236,420 198,390"/>
    <polygon points="150,470 246,470 198,440"/>
    <!-- Mái đình làng -->
    <polygon points="460,560 620,560 540,510"/>
    <polygon points="430,570 650,570 540,550"/>
    <rect x="470" y="570" width="140" height="90"/>
    
    <polygon points="720,580 860,580 790,530"/>
    <rect x="740" y="580" width="100" height="80"/>
  </g>

  <!-- Lửa bùng cháy dữ dội -->
  <rect width="1280" height="720" fill="url(#fireGlow)"/>
  <path d="M0,720 Q120,620 220,670 T420,610 T620,640 T820,590 T1020,630 T1280,600 L1280,720 Z" fill="#ea580c" opacity="0.75" filter="url(#glow)"/>
  <path d="M0,720 Q160,650 300,700 T580,650 T880,680 T1180,640 L1280,720 Z" fill="#facc15" opacity="0.6" filter="url(#glow)"/>

  <!-- Tàn tro & Đốm lửa bay lượn -->
  <g fill="#fef08a" opacity="0.85" filter="url(#glow)">
    <circle cx="280" cy="480" r="3"/>
    <circle cx="340" cy="410" r="2"/>
    <circle cx="410" cy="360" r="3.5"/>
    <circle cx="520" cy="420" r="2.5"/>
    <circle cx="680" cy="380" r="4"/>
    <circle cx="750" cy="460" r="2"/>
    <circle cx="830" cy="340" r="3"/>
    <circle cx="910" cy="390" r="2.5"/>
    <circle cx="610" cy="290" r="3"/>
  </g>

  <!-- Tiêu đề chương hồi Thư Pháp -->
  <g font-family="'Times New Roman', serif">
    <rect x="40" y="40" width="440" height="72" rx="6" fill="#000000" opacity="0.65" stroke="#dc2626" stroke-width="1.5"/>
    <text x="60" y="72" fill="#fca5a5" font-size="14" font-weight="bold" letter-spacing="3">HỒI 1: KHỞI NGUYÊN NGŨ TỘC</text>
    <text x="60" y="98" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="1">BIỂN LỬA THANH KHÊ THÔN</text>
  </g>
</svg>