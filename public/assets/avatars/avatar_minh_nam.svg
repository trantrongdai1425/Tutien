<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgMinh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="40%" stop-color="#115e59"/>
      <stop offset="85%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </radialGradient>
    <filter id="ghostGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="256" fill="url(#bgMinh)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#2dd4bf" stroke-width="4" filter="url(#ghostGlow)"/>

  <!-- Áo choàng u linh rách tơi tả đen tuyền -->
  <path d="M110,512 C110,370 170,330 256,330 C342,330 402,370 402,512 Z" fill="#0f172a"/>
  
  <!-- Đầu lâu hoặc mặt nạ quỷ vương U Minh xám bạc -->
  <ellipse cx="256" cy="220" rx="58" ry="72" fill="#cbd5e1"/>
  <!-- Hốc mắt rực sáng hồn hỏa xanh biếc -->
  <ellipse cx="236" cy="215" rx="14" ry="10" fill="#042f2e"/>
  <ellipse cx="276" cy="215" rx="14" ry="10" fill="#042f2e"/>
  <circle cx="236" cy="215" r="6" fill="#2dd4bf" filter="url(#ghostGlow)"/>
  <circle cx="276" cy="215" r="6" fill="#2dd4bf" filter="url(#ghostGlow)"/>
  
  <!-- Mũ miện Dạ Xoa sừng quỷ u linh -->
  <path d="M190,180 L160,80 L220,130 Z" fill="#334155" filter="url(#ghostGlow)"/>
  <path d="M322,180 L352,80 L292,130 Z" fill="#334155" filter="url(#ghostGlow)"/>
  <polygon points="210,140 256,70 302,140" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  
  <!-- Đèn lồng U Minh Dẫn Hồn ngọn lửa xanh bập bùng -->
  <g transform="translate(196, 360)">
    <rect x="40" y="20" width="40" height="60" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <ellipse cx="60" cy="50" rx="12" ry="20" fill="#5eead4" filter="url(#ghostGlow)"/>
    <line x1="60" y1="0" x2="60" y2="20" stroke="#94a3b8" stroke-width="3"/>
  </g>
</svg>